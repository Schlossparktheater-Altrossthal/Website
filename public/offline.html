<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | Sommertheater</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: Canvas;
        color: CanvasText;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.75;
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerade keine Verbindung</h1>
      <p>Der Mitgliederbereich braucht Internet. Sobald du wieder online bist, geht es weiter.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
