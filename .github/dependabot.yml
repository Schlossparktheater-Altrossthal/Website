version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint unterstützt TypeScript 7 noch nicht (typescript-eslint#10940).
      - dependency-name: "typescript"
        versions: [">=7"]
      # Projekt bleibt bewusst auf ESLint 9 (siehe „downgrade to ESLint 9“).
      - dependency-name: "eslint"
        versions: [">=10"]
      # @tanstack/react-table v9 bricht die API (createCoreRowModel/ReactTable statt getCoreRowModel/useReactTable).
      - dependency-name: "@tanstack/react-table"
        versions: [">=9"]
  - package-ecosystem: "npm"
    directory: "/realtime-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    labels:
      - dependencies
      - realtime
    groups:
      realtime-server:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - docker
