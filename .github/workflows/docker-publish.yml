name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Dockerfile.prod'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'tailwind.config.js'
      - 'eslint.config.mjs'
      - 'components.json'
      - 'src/**'
      - 'public/**'
      - 'prisma.config.ts'
      - 'prisma/**'
      - 'realtime-server/**'
      - 'scripts/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: limitlessgreen/theater_website

jobs:
  build-staging:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build & Deploy — Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: SKIP_PRISMA_POSTINSTALL=1 PRISMA_SKIP_POSTINSTALL_GENERATE=1 pnpm install --no-frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-staging-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-staging-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-staging-

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          REALTIME_BASE_PATH: /realtime
          NEXT_PUBLIC_REALTIME_URL: /realtime
          NEXT_PUBLIC_REALTIME_PATH: /realtime/socket.io
          NEXT_PUBLIC_REALTIME_INIT_PATH: /api/socket
          REALTIME_SERVER_EVENT_PATH: /realtime/events

      - name: Prune dev dependencies
        run: pnpm prune --prod

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}-staging
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout k8s-infrastructure
        uses: actions/checkout@v7
        with:
          repository: Schlossparktheater-Altrossthal/k8s-infrastructure
          token: ${{ secrets.K8S_INFRA_TOKEN }}
          path: k8s-infra

      - name: Update staging image tag
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ github.sha }}-staging|g" \
            k8s-infra/applications/website-staging/deployment.yaml
          cd k8s-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/website-staging/deployment.yaml
          git commit -m "chore(website): deploy ${{ github.sha }} to staging"
          git push
        env:
          IMAGE: ${{ env.IMAGE }}

  build-production:
    if: github.event_name == 'release'
    name: Build & Deploy — Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: SKIP_PRISMA_POSTINSTALL=1 PRISMA_SKIP_POSTINSTALL_GENERATE=1 pnpm install --no-frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-prod-

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          REALTIME_BASE_PATH: /realtime
          NEXT_PUBLIC_REALTIME_URL: /realtime
          NEXT_PUBLIC_REALTIME_PATH: /realtime/socket.io
          NEXT_PUBLIC_REALTIME_INIT_PATH: /api/socket
          REALTIME_SERVER_EVENT_PATH: /realtime/events

      - name: Prune dev dependencies
        run: pnpm prune --prod

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout k8s-infrastructure
        uses: actions/checkout@v7
        with:
          repository: Schlossparktheater-Altrossthal/k8s-infrastructure
          token: ${{ secrets.K8S_INFRA_TOKEN }}
          path: k8s-infra

      - name: Update production image tag
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ github.sha }}|g" \
            k8s-infra/applications/website/deployment.yaml
          cd k8s-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/website/deployment.yaml
          git commit -m "chore(website): deploy ${{ github.ref_name }} (${{ github.sha }}) to production"
          git push
        env:
          IMAGE: ${{ env.IMAGE }}
