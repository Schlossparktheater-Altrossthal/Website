name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [production]

jobs:
  update-k8s-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Update image tag in k8s-infrastructure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.K8S_INFRA_TOKEN }}
          script: |
            const sha = context.payload.workflow_run.head_sha.substring(0, 7);
            const owner = 'Schlossparktheater-Altrossthal';
            const repo = 'k8s-infrastructure';
            const path = 'applications/website/deployment.yaml';
            
            // Get current file
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path });
            const content = Buffer.from(file.content, 'base64').toString();
            
            // Update image tag
            const updated = content.replace(
              /image: limitlessgreen\/theater_website:.+/,
              `image: limitlessgreen/theater_website:${sha}`
            );
            
            if (content === updated) {
              core.setFailed('Image tag not found in deployment.yaml');
              return;
            }
            
            // Commit update
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `deploy: update website image to ${sha}`,
              content: Buffer.from(updated).toString('base64'),
              sha: file.sha,
            });
            
            core.info(`Updated image tag to ${sha}`);
