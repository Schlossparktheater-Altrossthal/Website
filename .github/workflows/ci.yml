name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Check formatting
        run: pnpm format:check
      - name: Run ESLint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      # Mitlesen über mehrere Pods (realtime-server/src/__tests__/script-live-redis.test.js)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest suite
        env:
          NODE_ENV: test
        run: pnpm test
      - name: Run realtime server tests
        working-directory: realtime-server
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: node --test

  sonar:
    runs-on: ubuntu-latest
    needs: [test]
    # Forks haben keinen Zugriff auf SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle Historie für Blame/neuen Code
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure coverage
        # Fehler entscheidet der test-Job; hier zählt nur der lcov-Bericht.
        continue-on-error: true
        env:
          NODE_ENV: test
        run: pnpm exec vitest run --coverage
      - name: Read version
        id: version
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Neuer Code = seit der letzten Version (New-Code-Definition „previous version“).
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}

  playwright:
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/theater_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: e2e-ci-only-not-a-real-secret-0123456789
      # Realtime-Server für das Live-Mitlesen (e2e/skript-mitlesen.spec.ts), startet mit next dev.
      REALTIME_HANDSHAKE_SECRET: e2e-ci-only-realtime-secret
      REALTIME_AUTH_TOKEN: e2e-ci-only-realtime-secret
      NEXT_PUBLIC_REALTIME_URL: http://localhost:4001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        # Nur die Engines, die die Projekte nutzen: Chromium und WebKit (Safari-Engine, siehe
        # playwright.config.ts Projekt `mobile-webkit`).
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
      - name: Seed database
        run: pnpm db:seed
      - name: Run Playwright tests
        env:
          CI: "true"
          # Playwright startet damit selbst den Dev-Server (playwright.config.ts webServer),
          # weil der Test-Login /api/dev/screenshot-session nur außerhalb von Production greift.
          SCAN_E2E_START_COMMAND: node realtime-server/src/server.js & pnpm exec next dev --turbo
        run: pnpm exec playwright test
