sonar.organization=schlossparktheater-altrossthal
sonar.projectKey=Schlossparktheater-Altrossthal_Website
sonar.host.url=https://sonarcloud.io

sonar.sources=src,realtime-server/src,scripts
sonar.tests=src,tests,e2e,realtime-server/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/__tests__/**,e2e/**,tests/**
sonar.exclusions=**/node_modules/**,src/test/mocks/**,public/**,dist/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=realtime-server/**,scripts/**
